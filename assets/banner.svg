<svg xmlns="http://www.w3.org/2000/svg" width="900" height="220" viewBox="0 0 900 220" role="img" aria-label="velixio - building fast, private tools">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f0a2e"/>
      <stop offset="1" stop-color="#0b1b3a"/>
    </linearGradient>
    <linearGradient id="ac" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
  </defs>
  <rect width="900" height="220" rx="16" fill="url(#bg)"/>
  <g stroke="url(#ac)" stroke-width="2" stroke-linecap="round" opacity="0.35">
    <line x1="-20" y1="190" x2="260" y2="30"><animate attributeName="opacity" values="0.1;0.5;0.1" dur="4s" repeatCount="indefinite"/></line>
    <line x1="40" y1="220" x2="320" y2="60"><animate attributeName="opacity" values="0.5;0.1;0.5" dur="5s" repeatCount="indefinite"/></line>
    <line x1="640" y1="230" x2="920" y2="70"><animate attributeName="opacity" values="0.1;0.5;0.1" dur="6s" repeatCount="indefinite"/></line>
  </g>
  <text x="60" y="110" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="64" font-weight="800" fill="url(#ac)" letter-spacing="2">velixio</text>
  <text x="62" y="156" font-family="'Courier New',monospace" font-size="22" fill="#c4b5fd">building fast, private tools_
    <animate attributeName="opacity" values="1;1;0.6;1" dur="2s" repeatCount="indefinite"/>
  </text>
  <circle cx="800" cy="110" r="42" fill="none" stroke="url(#ac)" stroke-width="3">
    <animate attributeName="r" values="38;46;38" dur="3s" repeatCount="indefinite"/>
  </circle>
  <path d="M786 96 L800 126 L814 96" fill="none" stroke="url(#ac)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
